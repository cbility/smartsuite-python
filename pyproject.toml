[project]
name = "smartsuite-python"
version = "0.1.0"
description = "Python client for the SmartSuite API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartsuite_python"]
include = [
    { path = "src/smartsuite_python/py.typed" },
]
